global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

# Both colours are scraped all the time. The idle colour is down or has no
# traffic, so it adds a `up == 0` series but no request rate. The "colour"
# label shows which one served the traffic.
scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:8081"]
        labels: { colour: blue }
      - targets: ["127.0.0.1:8082"]
        labels: { colour: green }
