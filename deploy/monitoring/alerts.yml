# Thresholds and the reasons for them go in docs/assumptions-log.md. The scrape
# itself is NOT excluded from the rates: it is a steady stream of 200s, so it
# lowers the error ratio a little, and the rules stay simple to read.
groups:
  - name: order-service
    rules:
      # The demo rule. It fires under load-test.sh, which sends about 10% bad
      # requests, and it matches the incident, where one IP made a burst of
      # 404s. 4xx counts as an error here because a scanner shows up as 4xx.
      - alert: OrderServiceHighErrorRatio
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"4..|5.."}[1m]))
            /
          sum(rate(http_server_requests_seconds_count[1m])) > 0.05
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "More than 5% of requests failed for 1 minute"
          description: "Error ratio is {{ $value | humanizePercentage }}. Check the dashboard by uri, then run the log query."

      # SLO rules. They do not fire in the demo, and the walkthrough says so.
      - alert: OrderServiceServerErrors
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          sum(rate(http_server_requests_seconds_count[5m])) > 0.005
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "5xx responses above 0.5% for 5 minutes"
          description: "5xx ratio is {{ $value | humanizePercentage }}."

      - alert: OrderServiceSlowP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket[5m]))) > 0.3
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "p95 latency above 300 ms for 5 minutes"
          description: "p95 is {{ $value | humanizeDuration }}."
