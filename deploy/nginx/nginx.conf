# Deploy-target nginx: the traffic switch for blue-green.
#
# Written whole rather than layered on top of the distro default, because
# AL2023 ships its own `listen 80 default_server` block and two of those on the
# same port stop nginx from starting at all -- a bad thing to discover during a
# switch.
#
# The upstream itself is NOT here. It lives in conf.d/upstream-order-service.conf,
# which bluegreen.sh rewrites. This file never changes; that one is the switch.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Silences a types_hash warning on every reload. A reload happens on every
    # traffic switch, and a warning that is always there is a warning nobody
    # reads when it matters. 2048 was not enough for this mime.types; 4096 was
    # verified with `nginx -t` on the target before committing.
    types_hash_max_size 4096;

    log_format kente '$remote_addr - $time_local "$request" '
                     '$status upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log kente;

    sendfile      on;
    keepalive_timeout 65;

    # upstream order_service_backend lives here, rewritten by bluegreen.sh
    include /etc/nginx/conf.d/upstream-order-service.conf;

    server {
        listen 80 default_server;
        server_name _;

        # Short timeouts: during a switch we would rather fail fast and retry
        # the other colour than hold a customer connection open for 60s.
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
        proxy_next_upstream   error timeout http_502 http_503 http_504;

        location / {
            proxy_pass http://order_service_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
