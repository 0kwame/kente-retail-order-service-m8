spring.application.name=order-service
server.port=8080

# Injected at runtime from Secrets Manager by deploy/bluegreen.sh (docker run
# -e DB_PASSWORD). Never put a value here: this is the line that held the
# plaintext password in the near-miss. Empty by default so tests and local runs
# start without it.
db.password=${DB_PASSWORD:}

# Metrics/observability -- Module 8 lab: wire this up to your Prometheus/Grafana
# stack. management.endpoints.web.exposure.include is deliberately narrow here;
# widening it (e.g. to "*") is a common way an actuator endpoint ends up exposed
# to more than intended, so think about what you actually need before adding to
# this list.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true
# Defence in depth for the near-miss, where /actuator/env served the DB
# password in plain text. ActuatorExposureTest fails the build if the list
# above ever grows to include env, heapdump, configprops or beans.
# If env is exposed anyway, its values stay masked (******):
management.endpoint.env.show-values=NEVER
management.endpoint.configprops.show-values=NEVER
# /actuator no longer lists what exists. The scanner in the incident read that
# page first, then went straight for /actuator/env.
management.endpoints.web.discovery.enabled=false

# Centralised logging: point this at your CloudWatch Logs agent or ELK/Filebeat
# shipper's expected format for this module's logging exercise.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} : %msg%n
